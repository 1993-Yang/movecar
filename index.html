<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>挪车服务</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: #f0f4f8;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 20px;
  }
  .container {
    max-width: 420px;
    width: 100%;
    background: #fff;
    border-radius: 20px;
    padding: 40px 24px 32px;
    box-shadow: 0 2px 20px rgba(0,0,0,0.06);
    text-align: center;
    align-self: flex-start;
    margin-top: 20px;
  }
  .icon {
    width: 72px;
    height: 72px;
    background: linear-gradient(135deg, #43d9a2, #2ec4a0);
    border-radius: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 16px;
  }
  .icon svg { width: 36px; height: 36px; fill: #fff; }
  h1 { font-size: 24px; color: #1a1a2e; margin-bottom: 8px; font-weight: 600; }
  .subtitle { font-size: 14px; color: #999; margin-bottom: 24px; }
  .notice {
    background: #fffbe6;
    border: 1px solid #ffe58f;
    border-radius: 10px;
    padding: 12px 16px;
    font-size: 14px;
    color: #d4a017;
    margin-bottom: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }
  .plate-card {
    background: linear-gradient(135deg, #43d9a2, #2ec4a0);
    border-radius: 14px;
    padding: 24px;
    margin-bottom: 20px;
  }
  .plate-label { font-size: 13px; color: rgba(255,255,255,0.8); margin-bottom: 8px; }
  .plate-number { font-size: 32px; color: #fff; font-weight: 700; letter-spacing: 4px; }
  .phone-card {
    background: #f8f9fa;
    border-radius: 14px;
    padding: 20px 24px;
    margin-bottom: 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .phone-info { text-align: left; }
  .phone-label { font-size: 13px; color: #999; margin-bottom: 4px; }
  .phone-number { font-size: 22px; color: #1a1a2e; font-weight: 600; }
  .phone-icon {
    width: 40px; height: 40px;
    background: #e8f8f0;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
  }
  .phone-icon svg { width: 20px; height: 20px; fill: #2ec4a0; }
  .call-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: 100%;
    padding: 18px;
    background: linear-gradient(135deg, #43d9a2, #2ec4a0);
    color: #fff;
    font-size: 18px;
    font-weight: 600;
    border: none;
    border-radius: 14px;
    cursor: pointer;
    text-decoration: none;
    transition: transform 0.15s, box-shadow 0.15s;
    box-shadow: 0 4px 15px rgba(46,196,160,0.3);
  }
  .call-btn:active { transform: scale(0.97); }
  .call-btn svg { width: 22px; height: 22px; fill: #fff; }
  .call-btn:disabled { opacity: 0.7; cursor: default; }
  .footer {
    margin-top: 24px;
    font-size: 13px;
    color: #bbb;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
  }
</style>
</head>
<body>
<div class="container">
  <div class="icon">
    <svg viewBox="0 0 24 24"><path d="M18.92 6.01C18.72 5.42 18.16 5 17.5 5h-11c-.66 0-1.21.42-1.42 1.01L3 12v8c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1h12v1c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-8l-2.08-5.99zM6.5 16c-.83 0-1.5-.67-1.5-1.5S5.67 13 6.5 13s1.5.67 1.5 1.5S7.33 16 6.5 16zm11 0c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zM5 11l1.5-4.5h11L19 11H5z"/></svg>
  </div>
  <h1>挪车服务</h1>
  <p class="subtitle">如有需要，请联系车主挪车</p>

  <div class="notice">
    <span>&#9888;</span> 请文明沟通，谢谢配合
  </div>

  <div class="plate-card">
    <div class="plate-label">车牌号码</div>
    <div class="plate-number">川R&middot;02U02</div>
  </div>

  <div class="phone-card">
    <div class="phone-info">
      <div class="phone-label">联系电话</div>
      <div class="phone-number">18784736782</div>
    </div>
    <div class="phone-icon">
      <svg viewBox="0 0 24 24"><path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/></svg>
    </div>
  </div>

  <button id="callBtn" onclick="notifyAndCall()" class="call-btn">
    <svg viewBox="0 0 24 24"><path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/></svg>
    一键挪车
  </button>

  <div class="footer">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="#bbb"><path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/></svg>
    点击按钮通知车主并拨打电话
  </div>
</div>
<script>
function notifyAndCall() {
  var btn = document.getElementById('callBtn');
  btn.disabled = true;
  var now = new Date();
  var pad = function(n) { return String(n).padStart(2, '0'); };
  var timeStr = now.getFullYear() + '-' + pad(now.getMonth() + 1) + '-' +
    pad(now.getDate()) + ' ' + pad(now.getHours()) + ':' +
    pad(now.getMinutes()) + ':' + pad(now.getSeconds());

  var ua = navigator.userAgent;
  var device = /Android/i.test(ua) ? 'Android\u8bbe\u5907' :
    /iPhone|iPad|iPod/i.test(ua) ? 'iOS\u8bbe\u5907' :
    /Windows/i.test(ua) ? 'Windows\u7535\u8111' :
    /Mac/i.test(ua) ? 'Mac\u7535\u8111' : '\u672a\u77e5\u8bbe\u5907';

  var conn = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
  var network = conn ? (conn.effectiveType || conn.type || '\u672a\u77e5').toUpperCase() : '\u672a\u77e5';

  var gpsInfo = '\u672a\u83b7\u53d6';
  var locationInfo = '\u5b9a\u4f4d\u83b7\u53d6\u5931\u8d25\u6216\u88ab\u62d2\u7edd';
  var geoPromise = Promise.resolve();
  if (navigator.geolocation) {
    geoPromise = new Promise(function(resolve) {
      navigator.geolocation.getCurrentPosition(function(pos) {
        gpsInfo = pos.coords.latitude.toFixed(6) + ', ' + pos.coords.longitude.toFixed(6);
        locationInfo = gpsInfo;
        resolve();
      }, function() { resolve(); }, { timeout: 5000 });
    });
  }

  var ipInfo = '\u672a\u77e5';
  var ipPromise = fetch('https://ipapi.co/json/').then(function(r) {
    return r.json();
  }).then(function(data) {
    ipInfo = data.ip || '\u672a\u77e5';
  }).catch(function() {});

  Promise.all([geoPromise, ipPromise]).then(function() {
    var count = parseInt(localStorage.getItem('movecar_count') || '0', 10) + 1;
    localStorage.setItem('movecar_count', String(count));

    var content =
      '\u8f66\u724c\u53f7\uff1a\u5dddR\u00b702U02\n' +
      '\u65f6\u95f4\uff1a' + timeStr + '\n' +
      '\u8bbe\u5907\uff1a' + device + '\n' +
      '\u7f51\u7edc\uff1a' + network + '\n' +
      'IP\u5730\u5740\uff1a' + ipInfo + '\n' +
      'GPS\u5750\u6807\uff1a' + gpsInfo + '\n' +
      '\u4f4d\u7f6e\uff1a' + locationInfo + '\n' +
      '\u8bbf\u95ee\u6b21\u6570\uff1a\u7b2c ' + count + ' \u6b21';

    var pushUrl = 'https://www.pushplus.plus/send?token=bc0031aa88394804bd62e88adac5003e&title=' +
      encodeURIComponent('\ud83d\ude97 \u632a\u8f66\u901a\u77e5') +
      '&content=' + encodeURIComponent(content) + '&template=txt';

    var img = new Image();
    img.src = pushUrl;

    setTimeout(function() {
      btn.disabled = false;
      window.location.href = 'tel:18784736782';
    }, 1500);
  });
}
</script>
</body>
</html>
